<script>/* WARHOOK Sound — детерминированный «голос» картины из её seed. Чистый Web Audio. */
window.WarhookSound = (function () {
  let ctx, master, analyser, bus = null, playing = false, rafId = 0, endT = 0;
  const SCALES = [[0,2,4,7,9],[0,3,5,7,10],[0,2,3,7,9],[0,2,5,7,10],[0,3,5,8,10],[0,2,4,6,9]];
  function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
  function mf(m){return 440*Math.pow(2,(m-69)/12);}
  function ensure(){
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0.85;
    const comp = ctx.createDynamicsCompressor();
    analyser = ctx.createAnalyser(); analyser.fftSize = 256;
    master.connect(comp); comp.connect(analyser); analyser.connect(ctx.destination);
  }
  function note(freq, t, dur, type, vol, dest){
    const o = ctx.createOscillator(); o.type = type; o.frequency.value = freq;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.05);
  }
  function viz(canvas){
    if (!canvas) return;
    const c2 = canvas.getContext('2d');
    const data = new Uint8Array(analyser.frequencyBinCount);
    function loop(){
      const w = canvas.width = canvas.clientWidth * 2;
      const h = canvas.height = canvas.clientHeight * 2;
      c2.clearRect(0,0,w,h);
      if (!playing) return;
      analyser.getByteFrequencyData(data);
      const n = data.length, bw = w / n;
      for (let i=0;i<n;i++){ const v=data[i]/255, bh=v*h; c2.fillStyle='rgba(228,178,76,'+(0.25+v*0.7)+')'; c2.fillRect(i*bw, h-bh, bw*0.7, bh); }
      rafId = requestAnimationFrame(loop);
    }
    loop();
  }
  function play(seed, canvas, onEnd){
    ensure(); if (ctx.state === 'suspended') ctx.resume();
    stop();
    const r = mulberry32((seed>>>0) || 1), now = ctx.currentTime + 0.06, DUR = 15;
    bus = ctx.createGain(); bus.gain.value = 1; bus.connect(master);
    const lp = ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 1500 + r()*2000; lp.connect(bus);
    const delay = ctx.createDelay(); delay.delayTime.value = 0.22 + r()*0.14;
    const fb = ctx.createGain(); fb.gain.value = 0.30; const wet = ctx.createGain(); wet.gain.value = 0.22;
    delay.connect(fb); fb.connect(delay); delay.connect(wet); wet.connect(bus); lp.connect(delay);
    const scale = SCALES[Math.floor(r()*SCALES.length)];
    const root = 48 + Math.floor(r()*9);
    const types = ['sine','triangle','sine','sawtooth'];
    const mType = types[Math.floor(r()*types.length)];
    const step = 0.15 + r()*0.14;
    // pad (root + fifth)
    note(mf(root-12), now, DUR, 'sine', 0.05, bus);
    note(mf(root-12+7), now, DUR, 'sine', 0.045, bus);
    // melody + bass
    let t = now, i = 0;
    while (t < now + DUR - 0.6){
      const m = root + scale[Math.floor(r()*scale.length)] + 12*(1 + Math.floor(r()*2));
      note(mf(m), t, step*(1.3 + r()*1.5), mType, 0.09 + r()*0.09, lp);
      if (i % 4 === 0) note(mf(root-12 + scale[Math.floor(r()*scale.length)]), t, step*3, 'triangle', 0.09, bus);
      t += step * (r() < 0.18 ? 2 : 1); i++;
    }
    playing = true; endT = Date.now() + DUR*1000;
    viz(canvas);
    clearTimeout(play._to);
    play._to = setTimeout(function(){ playing = false; if (onEnd) onEnd(); }, DUR*1000 + 150);
    return DUR;
  }
  function stop(){
    playing = false; cancelAnimationFrame(rafId); clearTimeout(play._to);
    if (bus && ctx){ try { bus.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.05); const b=bus; setTimeout(function(){ try{b.disconnect();}catch(e){} }, 300); } catch(e){} bus = null; }
  }
  return { play: play, stop: stop, isPlaying: function(){ return playing; } };
})();
</script>

const MOODS = [{"k":"радость","e":"😊","pal":["#FF3EA5","#FFD100","#00E5FF"]},{"k":"меланхолия","e":"🌧","pal":["#3b4a63","#6a4a5a","#a56b8a"]},{"k":"бунт","e":"🔥","pal":["#E4032E","#111111","#FFD100"]},{"k":"тишина","e":"🕊","pal":["#8fa0bd","#7a5c66","#c7cede"]},{"k":"провокация","e":"💥","pal":["#A56BFF","#E4032E","#00E5FF"]},{"k":"игра","e":"🎲","pal":["#FFB020","#38E08A","#FF6B4A"]},{"k":"любовь","e":"❤️","pal":["#FF6B8A","#E4B24C","#FF3EA5"]},{"k":"случайно","e":"🎰","pal":["#00E5FF","#A56BFF","#FF3EA5"]}];
const CONCEPTS = {"радость":["Цвет кричит: сегодня можно всё.","Праздник, которому не нужен повод.","Жизнь — это фейерверк, если смотреть в упор.","Улыбка, растянутая на весь холст."],"меланхолия":["Дождь за окном рисует лучше нас.","Красота живёт в том, что уходит.","Осень внутри бывает круглый год.","Грусть — это любовь, которой некуда идти."],"бунт":["Граффити на памятнике. История — стена, которую ещё не закрасили.","Правила писали не для художников.","Кто сказал, что нельзя? Уже нарисовано.","Крюк цепляет систему за живое."],"тишина":["Пауза между нотами. Именно там — музыка.","Пустота — это холст, полный возможностей.","Молчание громче любого крика.","Один цвет. И целая вселенная в нём."],"провокация":["Искусство должно оставлять синяк.","Если не спорят — значит, не искусство.","Скандал — это комплимент от толпы.","Дорого? А ты попробуй отвести взгляд."],"игра":["Взрослые — это дети, которые забыли, как играть.","Мультик, который стоит как самолёт.","Серьёзность переоценена.","Правила игры пишет тот, кто смеётся."],"любовь":["Сердце в горошек бьётся громче.","Любовь — единственная краска, что не выцветает.","Двое смотрят в одну сторону — это и есть искусство.","Тёплый цвет для холодного мира."],"случайно":["Оракул бросил кости вселенной.","Случайность — псевдоним судьбы.","То, что нашло тебя само."]};
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cur={mood:null, seed:0, artist:null, concept:''};

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function fnv(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function pick(arr,r){return arr[Math.floor(r()*arr.length)];}

function drawArt(seed, pal){
  const DPR=Math.min(devicePixelRatio||1,2), w=cv.clientWidth, h=w*0.625;
  cv.width=w*DPR; cv.height=h*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  const r=mulberry32(seed>>>0);
  ctx.fillStyle='#0a0e17'; ctx.fillRect(0,0,w,h);
  // flow strokes
  ctx.globalCompositeOperation='lighter'; ctx.lineWidth=1;
  const parts=[]; const N=380;
  for(let i=0;i<N;i++)parts.push({x:r()*w,y:r()*h,c:pal[Math.floor(r()*pal.length)]});
  const ph=r()*10;
  for(let s=0;s<70;s++){for(const p of parts){const a=(Math.sin(p.x*0.02+Math.cos(p.y*0.015+ph))+Math.cos(p.y*0.02))*Math.PI;const nx=p.x+Math.cos(a)*2,ny=p.y+Math.sin(a)*2;ctx.strokeStyle=p.c+'22';ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(nx,ny);ctx.stroke();p.x=nx;p.y=ny;}}
  const nb=8+Math.floor(r()*8);
  for(let i=0;i<nb;i++){const cx=r()*w,cy=r()*h,rad=18+r()*70,col=pal[Math.floor(r()*pal.length)];const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);g.addColorStop(0,col+'aa');g.addColorStop(1,col+'00');ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad,0,6.28);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,2.5,0,6.28);ctx.fill();}
  // signature hook
  ctx.globalCompositeOperation='source-over';
  ctx.strokeStyle='#E4B24C';ctx.lineWidth=3;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(w-40,h-58);ctx.lineTo(w-40,h-40);ctx.arc(w-49,h-40,9,0,Math.PI*1.4);ctx.stroke();
  ctx.fillStyle='#E4B24C';ctx.font='12px Georgia';ctx.textAlign='right';ctx.fillText('WARHOOK ORACLE', w-64, h-16);
}

function predict(moodKey){
  WarhookSound.stop(); document.getElementById('sndBtn').textContent='🔊 Слушать';
  const seed=(Math.floor(Math.random()*1e9))>>>0, r=mulberry32(seed);
  let mood=moodKey, palMood=moodKey;
  if(moodKey==='случайно'){ const real=MOODS.filter(m=>m.k!=='случайно'); const mm=pick(real,r); mood=mm.k; palMood=mm.k; }
  const mObj=MOODS.find(m=>m.k===palMood)||MOODS[0];
  let cand=ARTISTS.filter(a=>a.m.includes(mood)); if(!cand.length)cand=ARTISTS;
  const artist=pick(cand,r);
  const concept=pick(CONCEPTS[mood]||CONCEPTS['случайно'],r);
  cur={mood, seed, artist, concept};
  drawArt(seed, mObj.pal);
  document.getElementById('concept').textContent=concept;
  document.getElementById('aName').textContent=artist.n;
  document.getElementById('aPrice').textContent=artist.p;
  document.getElementById('aMeta').textContent=[artist.c, artist.st].filter(Boolean).join(' · ');
  document.getElementById('aBio').textContent=artist.bio;
  document.getElementById('result').classList.add('on');
  document.getElementById('result').scrollIntoView({behavior:'smooth',block:'start'});
}
function sound(){const b=document.getElementById('sndBtn');if(WarhookSound.isPlaying()){WarhookSound.stop();b.textContent='🔊 Слушать';}else{b.textContent='⏸ Стоп';WarhookSound.play(fnv(cur.mood)^cur.seed, null, ()=>{b.textContent='🔊 Слушать';});}}

MOODS.forEach(m=>{const b=document.createElement('button');b.className='mood';b.innerHTML='<span class="e">'+m.e+'</span>'+m.k;b.onclick=()=>{document.querySelectorAll('.mood').forEach(x=>x.classList.remove('on'));b.classList.add('on');predict(m.k);};mm.appendChild(b);});
